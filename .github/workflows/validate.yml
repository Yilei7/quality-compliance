name: validate-release

on:
  push:
    branches: [main]
  pull_request:

jobs:
  release-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release
        run: python scripts/validate_release.py
      - name: Build archive
        run: python scripts/build_release.py --output-dir dist
      - name: Check archive contents
        run: unzip -l dist/*.zip

